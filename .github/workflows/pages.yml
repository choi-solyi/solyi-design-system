name: Verified packages and Pages
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      verify_failure:
        description: 'Fail after checks to verify that deployment stays blocked'
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: solyi-pages-${{ github.ref }}
  cancel-in-progress: true
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: '22.23.3'
          cache: npm
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: node scripts/library-pipeline.mjs
      - name: Verify failure gate when explicitly requested
        if: ${{ inputs.verify_failure == true }}
        run: exit 1
      - name: Upload verified Pages output
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v4
        with:
          path: docs
  deploy:
    needs: validate
    if: github.event_name != 'pull_request'
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to the existing Pages site
        id: deployment
        uses: actions/deploy-pages@v4
